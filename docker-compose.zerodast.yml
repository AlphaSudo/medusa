services:
  medusa:
    image: medusa-docker:latest
    build:
      context: .
      dockerfile: Dockerfile.zerodast
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
      JWT_SECRET: zerodast-ci-jwt-secret
      COOKIE_SECRET: zerodast-ci-cookie-secret
      NODE_ENV: production
      STORE_CORS: "http://localhost:8000"
      ADMIN_CORS: "http://localhost:7001"
    ports:
      - "9000:9000"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
    healthcheck:
      test: "pg_isready -U medusa -d medusa"
      interval: 5s
      retries: 10
      timeout: 2s
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
