name: Vanilla ZAP Baseline
on:
  workflow_dispatch:
  push:
    branches: [zerodast-install]
    paths:
      - '.github/workflows/vanilla-zap-baseline.yml'
      - 'docker-compose.zerodast.yml'
      - 'Dockerfile.zerodast'
      - 'zerodast/**'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start target
        run: |
          docker compose -f docker-compose.zerodast.yml up -d --build
          echo "Waiting for Medusa to be healthy..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:9000/health >/dev/null 2>&1; then
              echo "Medusa is ready (attempt $i)"
              break
            fi
            sleep 3
          done

      - name: Run vanilla ZAP
        run: |
          NETWORK=$(docker network ls --format '{{.Name}}' | grep medusa | head -1)
          echo "Using network: $NETWORK"

          mkdir -p vanilla-reports
          chmod 777 vanilla-reports

          START_TS=$(date +%s)

          cat > vanilla-reports/automation.yaml <<'YAML'
          env:
            contexts:
              - name: "vanilla-baseline"
                urls:
                  - "http://medusa:9000"
                includePaths:
                  - "http://medusa:9000.*"
            parameters:
              failOnError: false
              progressToStdout: true
          jobs:
            - type: spider
              parameters:
                context: "vanilla-baseline"
                url: "http://medusa:9000"
                maxDuration: 2
                maxDepth: 5
                maxChildren: 50
            - type: passiveScan-wait
              parameters:
                maxDuration: 2
            - type: activeScan
              parameters:
                context: "vanilla-baseline"
                maxRuleDurationInMins: 5
                maxScanDurationInMins: 15
                threadPerHost: 4
                delayInMs: 50
              policyDefinition:
                defaultStrength: medium
                defaultThreshold: low
            - type: report
              parameters:
                template: "traditional-json"
                reportDir: "/zap/wrk"
                reportFile: "zap-report.json"
            - type: report
              parameters:
                template: "traditional-html"
                reportDir: "/zap/wrk"
                reportFile: "zap-report.html"
          YAML

          docker run --rm \
            --network "$NETWORK" \
            -v "$(pwd)/vanilla-reports:/zap/wrk:rw" \
            zaproxy/zap-stable:2.17.0 \
            zap.sh -cmd -autorun /zap/wrk/automation.yaml \
            2>&1 | tee vanilla-reports/zap-run.log

          END_TS=$(date +%s)
          DURATION=$((END_TS - START_TS))
          echo "VANILLA_DURATION=${DURATION}" >> $GITHUB_ENV
          echo "Vanilla ZAP completed in ${DURATION}s"

      - name: Parse results
        if: always()
        run: |
          if [ -f vanilla-reports/zap-report.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('vanilla-reports/zap-report.json','utf8'));
              const sites = r.site || [];
              let high=0, medium=0, low=0, info=0, uris=new Set();
              for (const s of sites) {
                for (const a of (s.alerts || [])) {
                  const risk = parseInt(a.riskcode);
                  const count = (a.instances || []).length;
                  if (risk === 3) high += count;
                  else if (risk === 2) medium += count;
                  else if (risk === 1) low += count;
                  else info += count;
                  for (const inst of (a.instances || [])) {
                    if (inst.uri) uris.add(inst.uri.split('?')[0]);
                  }
                }
              }
              const spiderMatch = require('fs').readFileSync('vanilla-reports/zap-run.log','utf8').match(/spider found (\\d+) URLs/);
              const spiderUrls = spiderMatch ? spiderMatch[1] : 'unknown';
              const summary = {
                duration: process.env.VANILLA_DURATION + 's',
                spiderUrls,
                alerts: { high, medium, low, informational: info },
                totalAlertInstances: high + medium + low + info,
                uniqueAlertUris: uris.size,
                alertUris: [...uris].sort()
              };
              require('fs').writeFileSync('vanilla-reports/vanilla-summary.json', JSON.stringify(summary, null, 2));
              console.log(JSON.stringify(summary, null, 2));
            "
          else
            echo 'No ZAP report generated'
            echo '{}' > vanilla-reports/vanilla-summary.json
          fi

      - name: Write summary
        if: always()
        run: |
          echo "## Vanilla ZAP Baseline: Medusa" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **No auth** — unauthenticated scan only" >> $GITHUB_STEP_SUMMARY
          echo "- **No seeding** — spider only" >> $GITHUB_STEP_SUMMARY
          echo "- **Same ZAP version** (2.17.0) and scan settings as ZeroDAST nightly profile" >> $GITHUB_STEP_SUMMARY
          echo "- **Same CI runner** and Docker Compose target as ZeroDAST Nightly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f vanilla-reports/vanilla-summary.json ]; then
            cat vanilla-reports/vanilla-summary.json >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanilla-zap-baseline
          path: vanilla-reports/
