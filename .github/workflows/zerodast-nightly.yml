name: ZeroDAST Nightly
run-name: ZeroDAST Nightly (${{ github.event_name == 'workflow_dispatch' && inputs.zap_variant || 'stock' }})

on:
  push:
    branches: [main, develop, zerodast-install]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      zap_variant:
        description: Scanner image variant to benchmark
        required: false
        default: stock
        type: choice
        options:
          - stock
          - surgical

permissions:
  contents: read

concurrency:
  group: zerodast-nightly-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.zap_variant || 'stock' }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve scanner image
        id: scanner
        env:
          REQUESTED_ZAP_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.zap_variant || 'stock' }}
        run: |
          set -euo pipefail
          variant="${REQUESTED_ZAP_VARIANT:-stock}"
          case "${variant}" in
            stock)
              image="zaproxy/zap-stable:2.17.0"
              ;;
            surgical)
              cat > "${RUNNER_TEMP}/Dockerfile.zerodast-scanner" <<'EOF'
              FROM ghcr.io/zaproxy/zaproxy:2.17.0-bare
              USER root
              USER zap
              ENV ZAP_PORT=8080
              USER root
              RUN apk add --no-cache firefox-esr \
                  && ln -sf /usr/bin/firefox-esr /usr/bin/firefox
              USER zap
              USER root
              RUN rm -f \
                  /zap/plugin/ascanrules-release-78.zap \
                  /zap/plugin/authhelper-beta-0.34.0.zap \
                  /zap/plugin/encoder-release-1.8.0.zap \
                  /zap/plugin/exim-beta-0.16.0.zap \
                  /zap/plugin/graaljs-alpha-0.12.0.zap \
                  /zap/plugin/openapi-beta-48.zap \
                  /zap/plugin/pscanrules-release-70.zap \
                  /zap/plugin/quickstart-release-53.zap \
                  /zap/plugin/requester-beta-7.9.0.zap \
                  /zap/plugin/retire-release-0.52.0.zap \
                  /zap/plugin/selenium-release-15.43.0.zap \
                  /zap/plugin/spider-release-0.18.0.zap \
                  /zap/plugin/graphql-alpha-0.29.0.zap \
                  /zap/plugin/graphql-alpha-0.32.0.zap \
                  /zap/plugin/hud-beta-0.19.0.zap \
                  /zap/plugin/postman-alpha-0.9.0.zap \
                  /zap/plugin/formhandler-beta-6.8.0.zap \
                  /zap/plugin/fuzz-beta-13.16.0.zap \
                  /zap/plugin/soap-beta-29.zap \
                  /zap/plugin/zest-beta-48.11.0.zap \
                  /zap/plugin/zest-beta-48.12.0.zap \
                  /zap/plugin/websocket-release-35.zap \
                  /zap/plugin/insights-alpha-0.0.1.zap 2>/dev/null || true
              USER zap
              RUN find /zap/plugin /home/zap/.ZAP/plugin -maxdepth 1 -name '*.zap' 2>/dev/null | wc -l
              HEALTHCHECK CMD curl --silent --output /dev/null --fail http://localhost:8080/ || exit 1
              EOF
              docker build -t zerodast-scanner:ci-benchmark -f "${RUNNER_TEMP}/Dockerfile.zerodast-scanner" "${RUNNER_TEMP}"
              image="zerodast-scanner:ci-benchmark"
              ;;
            *)
              echo "Unsupported zap_variant: ${variant}" >&2
              exit 1
              ;;
          esac

          echo "zap_variant=${variant}" >> "$GITHUB_OUTPUT"
          echo "zap_image=${image}" >> "$GITHUB_OUTPUT"

      - name: Run ZeroDAST nightly scan
        env:
          ZERODAST_MODE: nightly
          ZAP_IMAGE: ${{ steps.scanner.outputs.zap_image }}
        run: |
          chmod +x zerodast/run-scan.sh zerodast/seed.sh
          echo "::notice::ZeroDAST: starting scan (heartbeat every 30s until finished)"
          (
            while true; do
              sleep 30
              echo "::notice::ZeroDAST: still running — compose build/up, health wait, auth, ZAP, or reports ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
            done
          ) &
          HEARTBEAT_PID=$!
          cleanup() { kill "$HEARTBEAT_PID" 2>/dev/null || true; wait "$HEARTBEAT_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          zerodast/run-scan.sh

      - name: Upload ZeroDAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerodast-nightly-report-${{ steps.scanner.outputs.zap_variant }}
          path: zerodast/reports
          if-no-files-found: warn

      - name: Write summary
        if: always()
        run: |
          echo "Scanner variant: ${{ steps.scanner.outputs.zap_variant }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Scanner image: \`${{ steps.scanner.outputs.zap_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in zerodast/reports/summary.md zerodast/reports/operational-reliability.md zerodast/reports/result-state.md zerodast/reports/api-inventory.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ ! -f zerodast/reports/summary.md ]; then
            echo 'ZeroDAST summary not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
