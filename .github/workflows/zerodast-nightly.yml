name: ZeroDAST Nightly
run-name: ZeroDAST Nightly (${{ github.event_name == 'workflow_dispatch' && format('{0}/{1}', inputs.zap_variant, inputs.profile_variant) || 'stock/unprofiled' }})

on:
  push:
    branches: [main, develop, zerodast-install]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      zap_variant:
        description: Scanner image variant to benchmark
        required: false
        default: stock
        type: choice
        options:
          - stock
          - surgical
      profile_variant:
        description: Scan profile mode to benchmark
        required: false
        default: unprofiled
        type: choice
        options:
          - unprofiled
          - profiled

permissions:
  contents: read

concurrency:
  group: zerodast-nightly-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.zap_variant || 'stock' }}-${{ github.event_name == 'workflow_dispatch' && inputs.profile_variant || 'unprofiled' }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout ZeroDAST profile tools
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_variant == 'profiled' }}
        uses: actions/checkout@v4
        with:
          repository: AlphaSudo/zerodast
          ref: codex/nightly-v2-surgical
          path: zerodast-benchmark-tools
          fetch-depth: 1
          sparse-checkout: |
            scripts/build-profiled-automation.js
            scripts/package.json
            scripts/package-lock.json
            security/profiles/base-rest-api.yaml
            security/profiles/target-medusa.yaml

      - name: Install ZeroDAST profile tool dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_variant == 'profiled' }}
        run: npm ci --prefix zerodast-benchmark-tools/scripts

      - name: Resolve scanner image
        id: scanner
        env:
          REQUESTED_ZAP_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.zap_variant || 'stock' }}
        run: |
          set -euo pipefail
          variant="${REQUESTED_ZAP_VARIANT:-stock}"
          case "${variant}" in
            stock)
              image="zaproxy/zap-stable:2.17.0"
              ;;
            surgical)
              dockerfile="${RUNNER_TEMP}/Dockerfile.zerodast-scanner"
              {
                echo 'FROM ghcr.io/zaproxy/zaproxy:2.17.0-bare'
                echo 'USER root'
                echo 'USER zap'
                echo 'ENV ZAP_PORT=8080'
                echo 'USER root'
                echo 'RUN apk add --no-cache firefox-esr \'
                echo '    && ln -sf /usr/bin/firefox-esr /usr/bin/firefox'
                echo 'USER zap'
                echo 'USER root'
                echo 'RUN rm -f \'
                echo '    /zap/plugin/ascanrules-release-78.zap \'
                echo '    /zap/plugin/authhelper-beta-0.34.0.zap \'
                echo '    /zap/plugin/encoder-release-1.8.0.zap \'
                echo '    /zap/plugin/exim-beta-0.16.0.zap \'
                echo '    /zap/plugin/graaljs-alpha-0.12.0.zap \'
                echo '    /zap/plugin/openapi-beta-48.zap \'
                echo '    /zap/plugin/pscanrules-release-70.zap \'
                echo '    /zap/plugin/quickstart-release-53.zap \'
                echo '    /zap/plugin/requester-beta-7.9.0.zap \'
                echo '    /zap/plugin/retire-release-0.52.0.zap \'
                echo '    /zap/plugin/selenium-release-15.43.0.zap \'
                echo '    /zap/plugin/spider-release-0.18.0.zap \'
                echo '    /zap/plugin/graphql-alpha-0.29.0.zap \'
                echo '    /zap/plugin/graphql-alpha-0.32.0.zap \'
                echo '    /zap/plugin/hud-beta-0.19.0.zap \'
                echo '    /zap/plugin/postman-alpha-0.9.0.zap \'
                echo '    /zap/plugin/formhandler-beta-6.8.0.zap \'
                echo '    /zap/plugin/fuzz-beta-13.16.0.zap \'
                echo '    /zap/plugin/soap-beta-29.zap \'
                echo '    /zap/plugin/zest-beta-48.11.0.zap \'
                echo '    /zap/plugin/zest-beta-48.12.0.zap \'
                echo '    /zap/plugin/websocket-release-35.zap \'
                echo '    /zap/plugin/insights-alpha-0.0.1.zap 2>/dev/null || true'
                echo 'USER zap'
                echo "RUN find /zap/plugin /home/zap/.ZAP/plugin -maxdepth 1 -name '*.zap' 2>/dev/null | wc -l"
                echo 'HEALTHCHECK CMD curl --silent --output /dev/null --fail http://localhost:8080/ || exit 1'
              } > "${dockerfile}"
              docker build -t zerodast-scanner:ci-benchmark -f "${dockerfile}" "${RUNNER_TEMP}"
              image="zerodast-scanner:ci-benchmark"
              ;;
            *)
              echo "Unsupported zap_variant: ${variant}" >&2
              exit 1
              ;;
          esac

          echo "zap_variant=${variant}" >> "$GITHUB_OUTPUT"
          echo "zap_image=${image}" >> "$GITHUB_OUTPUT"

      - name: Run ZeroDAST nightly scan
        env:
          ZERODAST_MODE: nightly
          ZAP_IMAGE: ${{ steps.scanner.outputs.zap_image }}
          PROFILE_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_variant || 'unprofiled' }}
        run: |
          chmod +x zerodast/run-scan.sh zerodast/seed.sh
          echo "::notice::ZeroDAST: starting scan (heartbeat every 30s until finished)"
          (
            while true; do
              sleep 30
              echo "::notice::ZeroDAST: still running — compose build/up, health wait, auth, ZAP, or reports ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
            done
          ) &
          HEARTBEAT_PID=$!
          cleanup() { kill "$HEARTBEAT_PID" 2>/dev/null || true; wait "$HEARTBEAT_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          if [ "${PROFILE_VARIANT}" = "profiled" ]; then
            export ZERODAST_PROFILE_TOOL_ROOT="${GITHUB_WORKSPACE}/zerodast-benchmark-tools"
            export SCAN_PROFILE="${GITHUB_WORKSPACE}/zerodast-benchmark-tools/security/profiles/target-medusa.yaml"
            export ZAP_PROFILE_MERGED_PATH="${RUNNER_TEMP}/profiled-automation.yaml"
          fi
          zerodast/run-scan.sh

      - name: Upload ZeroDAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerodast-nightly-report-${{ steps.scanner.outputs.zap_variant }}-${{ github.event_name == 'workflow_dispatch' && inputs.profile_variant || 'unprofiled' }}
          path: zerodast/reports
          if-no-files-found: warn

      - name: Write summary
        if: always()
        run: |
          echo "Scanner variant: ${{ steps.scanner.outputs.zap_variant }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Scanner image: \`${{ steps.scanner.outputs.zap_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Profile variant: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_variant || 'unprofiled' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in zerodast/reports/summary.md zerodast/reports/operational-reliability.md zerodast/reports/result-state.md zerodast/reports/api-inventory.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ ! -f zerodast/reports/summary.md ]; then
            echo 'ZeroDAST summary not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
